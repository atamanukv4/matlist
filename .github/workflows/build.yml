# Сборка APK Матлиста: веб-ядро (node build.js) → assets Android → APK, подписанный тестовым ключом → релиз на GitHub.
# Каждый push в modernize — бета-сборка (пререлиз). Ручной запуск (раз в неделю, для тестеров) — обычный релиз, «последняя версия».
# Тег релиза ставится на тот коммит, из которого собран APK.
name: Сборка APK

on:
  push:
    branches: [main, modernize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Модель рукописного ввода (релиз model-onnx)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model
          gh release download model-onnx -R ${{ github.repository }} -p encoder.onnx -p decoder_q.onnx -p vocab.txt -D model || echo "модели нет — APK без рукописного ввода"
          ls -la model

      - name: Веб-ядро и тесты
        run: |
          npm ci
          node build.js
          node test/engine.test.js
          node test/solvers.test.js
          node test/roundtrip.test.js
          node test/wsp.test.js
          node test/units.test.js
          node test/md.test.js
          node test/xmcd.test.js
          node test/stage1.test.js
          node test/stage2.test.js
          node test/stage3.test.js

      - name: Ресурсы страницы → assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/apk-assets/. android/app/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Имя файла
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Matlist-0.8.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Matlist-0.8.${{ github.run_number }}
          path: out/*.apk

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Матлист 0.8.${{ github.run_number }}${{ github.event_name == 'push' && ' (бета)' || '' }}
          body: |
            ${{ github.event_name == 'push' && 'Бета-сборка: собрана автоматически после правки, ещё не прошла ручную проверку.' || 'Тестовая сборка недели — для ручной проверки.' }}
            Ветка ${{ github.ref_name }}, коммит ${{ github.sha }}.
            Пробная сборка Матлиста для Android (APK подписан тестовым ключом).
            Установка: скачать APK на телефон → открыть → разрешить установку из этого источника.
          files: out/*.apk
          prerelease: ${{ github.event_name == 'push' }}
          make_latest: ${{ github.event_name != 'push' }}
